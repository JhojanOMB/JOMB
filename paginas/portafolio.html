<!-- PORTAFOLIO -->
<section
  id="portafolio"
  class="fondo neumorph mb-24 rounded-3xl py-10 px-4 sm:px-6 lg:px-12"
>
  <div class="max-w-6xl mx-auto space-y-8">
    <h2 class="text-3xl font-semibold text-center">Nuestro Portafolio</h2>
    
    <!-- Barra de búsqueda -->
    <div class="flex justify-center">
      <input
        type="search"
        id="portafolio-search"
        placeholder="Buscar proyecto..."
        aria-label="Buscar proyectos por nombre, descripción o tecnología"
        class="search-neumorph w-full md:w-1/2 border border-gray-300 rounded-full py-2 px-4"
      />
    </div>

    <!-- Filtros por categoría -->
    <div class="flex justify-center gap-4">
      <button data-cat="all" aria-pressed="true" class="btn-neumorph is-selected px-4 py-1 rounded-full transition">Todos</button>
      <button data-cat="web" aria-pressed="false" class="btn-neumorph px-4 py-1 rounded-full transition">Web</button>
      <button data-cat="desktop" aria-pressed="false" class="btn-neumorph px-4 py-1 rounded-full transition">Desktop</button>
    </div>

    <!-- Grid vacío: JS rellenará con tarjetas -->
    <div id="portafolio-grid" class="grid grid-cols-1 gap-6 sm:grid-cols-2 xl:grid-cols-3" aria-live="polite"></div>
  </div>
</section>

<!-- Template de tarjeta, invisible en el DOM -->
<template id="portafolio-card-template">
  <div class="portafolio-card group relative overflow-hidden rounded-3xl neumorph transition-all duration-300 hover:-translate-y-1">
    <!-- Imagen -->
    <img src="" alt="" class="h-48 w-full object-cover transition-transform duration-300 group-hover:scale-105" />

    <!-- Overlay al hover -->
    <div class="absolute inset-0 bg-black bg-opacity-40 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center">
      <!-- Contenedor genérico para acción -->
      <div data-role="action" class="flex items-center justify-center gap-4"></div>
    </div>

    <!-- Contenido -->
    <div class="portafolio-card-body flex min-h-[210px] flex-col justify-between p-6">
      <div>
        <h5 class="mb-2 text-xl font-bold text-[#0f172a] dark:text-[#f8fafc]" data-role="title">Título</h5>
        <p class="mb-4 text-sm font-medium text-[#334155] dark:text-[#cbd5e1]" data-role="desc">Descripción breve.</p>
      </div>
      <!-- Tech tags -->
      <div class="flex flex-wrap gap-2" data-role="tags"></div>
    </div>
  </div>
</template>
